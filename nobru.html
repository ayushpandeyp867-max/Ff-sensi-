<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOBRU REAL SENSI</title><style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}
.box{max-width:420px;margin:auto;background:#0e0e0e;border:3px solid #ff0040;border-radius:20px;padding:18px}
h1{color:#ff0040;margin:5px} .input,.sel{width:92%;padding:13px;background:#000;border:2px solid #444;color:#fff;border-radius:12px;font-size:16px;margin:6px 0}
.sel{border-color:#ff0040} .card{background:#000;border:1px solid #333;border-radius:11px;padding:12px;margin:7px 0;text-align:left}
.card b{color:#ff0040;float:right} .card.real{border-color:#ff0040;background:#1a0008}
.btn{width:100%;padding:15px;background:#ff0040;border:none;color:#fff;font-weight:bold;border-radius:13px;font-size:19px;margin-top:10px}
</style></head><body><div class="box">
<h1>🇧🇷 NOBRU <span style="font-size:12px;background:#ff0040;padding:3px 8px;border-radius:10px">REAL</span></h1><p style="color:#888;font-size:12px">Original Fluxo Tournament Config</p>
<input id="device" class="input" placeholder="Device Likh - Ex: Infinix Hot 50">

<option value="4">4GB RAM</option>
<option value="6">6GB RAM</option>

</select>
<button class="btn" onclick="gen()">GET REAL NOBRU SENSI 🔥</button>
<div id="res" style="display:none;margin-top:15px">
<p style="color:#ff0040;font-weight:bold;font-size:19px">🎯 <span id="dn">DEVICE</span> - REAL NOBRU</p>
<div class="card real">General: <b>100</b></div>
<div class="card real">Red Dot: <b>100</b></div>
<div class="card real">2x Scope: <b>95</b></div>
<div class="card real">4x Scope: <b>90</b></div>
<div class="card real">Sniper Scope: <b>76</b></div>

</div></div><script>
function gen(){
let d=document.getElementById('device').value||'MY DEVICE';let r=document.getElementById('ram').value;

}
