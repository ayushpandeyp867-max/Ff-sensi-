<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL GATO SENSI</title><style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}
.box{max-width:400px;margin:auto;background:#111;border:2px solid #00ff88;border-radius:20px;padding:20px}
h1{color:#00ff88} input,select,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:15px}
button{background:#00ff88;color:#000;font-weight:bold}
.result{margin-top:15px;background:#222;padding:15px;border-radius:10px;text-align:left;display:none}
</style></head><body><div class="box">
<h1>🐱 EL GATO SENSI</h1><p>One Tap King Config</p>
<input id="dev" placeholder="Device Likh - Ex: Redmi Note 12">
<select id="ram"><option>2GB RAM</option><option>3GB RAM</option><option>4GB RAM</option><option>6GB RAM</option><option>8GB RAM</option></select>
<button onclick="gen()">GET EL GATO SENSI 🔥</button>
<div id="res" class="result"></div>
</div><script>
function gen(){
let d=document.getElementById('dev').value||"Your Device";
let r=document.getElementById('ram').value;
document.getElementById('res').style.display='block';
document.getElementById('res').innerHTML=`<b>Device:</b> ${d}<br><b>RAM:</b> ${r}<br><br><b>👁️ General:</b> 95<br><b>🔴 Red Dot:</b> 98<br><b>🔍 2x:</b> 92<br><b>🎯 4x:</b> 89<br><b>📡 Sniper:</b> 65<br><b>🆓 Free Look:</b> 85<br><br><b>DPI:</b> 790<br><b>Fire:</b> 46<br><br>✅ El Gato Style One Tap`;
}
</script></body></html>
