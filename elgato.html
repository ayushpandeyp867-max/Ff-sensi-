<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL GATO REAL SENSI</title><style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}
.box{max-width:420px;margin:auto;background:#0e0e0e;border:3px solid #00ff88;border-radius:20px;padding:18px}
h1{color:#00ff88;margin:5px} .input,.sel{width:92%;padding:13px;background:#000;border:2px solid #444;color:#fff;border-radius:12px;font-size:16px;margin:6px 0}
.sel{border-color:#00ff88} .card{background:#000;border:1px solid #333;border-radius:11px;padding:12px;margin:7px 0;text-align:left}
.card b{color:#00ff88;float:right} .card.real{border-color:#00ff88;background:#001a0f}
.btn{width:100%;padding:15px;background:#00ff88;border:none;color:#000;font-weight:bold;border-radius:13px;font-size:19px;margin-top:10px}
</style></head><body><div class="box">
<h1>🐱 EL GATO <span style="font-size:12px;background:#00ff88;color:#000;padding:3px 8px;border-radius:10px">ONE TAP KING</span></h1><p style="color:#888;font-size:12px">Real One Tap Custom Config</p>
<input id="device" class="input" placeholder="Device Likh - Ex: Infinix Hot 50">
<select id="ram" class="sel">
<option value="4">4GB RAM - Low Device</option>
<option value="6">6GB RAM</option>
<option value="8" selected>8GB RAM</option>
<option value="12">12GB RAM</option>
</select>
<button class="btn" onclick="gen()">GET EL GATO SENSI 🔥</button>
<div id="res" style="display:none;margin-top:15px">
<p style="color:#00ff88;font-weight:bold;font-size:19px">🎯 <span id="dn">DEVICE</span> - EL GATO</p>
<div class="card real">General: <b>100</b></div>
<div class="card real">Red Dot: <b>98</b></div>
<div class="card real">2x Scope: <b>90</b></div>
<div class="card real">4x Scope: <b>85</b></div>
<div class="card real">Sniper Scope: <b>65</b></div>
<div class="card real">Free Look: <b>75</b></div>
<div class="card">DPI: <b id="dpi">650</b></div>
<div class="card">Fire Button: <b id="fire">22%</b></div>
<div class="card">RAM Optimized: <b id="ramshow">8GB</b></div>
<p style="color:#666;font-size:10px;margin-top:10px">Source: El Gato Live - One Tap King</p>
</div></div><script>
function gen(){
let d=document.getElementById('device').value||'MY DEVICE';let r=document.getElementById('ram').value;
document.getElementById('dn').innerText=d.toUpperCase();document.getElementById('ramshow').innerText=r+'GB';
document.getElementById('res').style.display='block';
if(r=='4'){dpi.innerText='580';fire.innerText='18%';} else if(r=='6'){dpi.innerText='620';fire.innerText='20%';} else if(r=='8'){dpi.innerText='650';fire.innerText='22%';} else {dpi.innerText='700';fire.innerText='25%';}
}
</script></body></html>
