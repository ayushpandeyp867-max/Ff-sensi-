2x 98 | 4x 99 | AWM 90<br>HUD 55% | Fire 52% | DPI MAX</p></div></div><script>function gen(){let d=document.getElementById('device').value;let ram=document.getElementById('ram').value;let sensi=100,name="DEVICE";if(d.includes("Redmi")){sensi=100;name="REDMI"}else if(d.includes("Realme")){sensi=98;name="REALME"}else if(d.includes("Samsung")){sensi=92;name="SAMSUNG"}else if(d.includes("Infinix")||d.includes("Tecno")){sensi=100;name="INFINIX"}else if(d.includes("OnePlus")){sensi=88;name="ONEPLUS"}else if(d.includes("Vivo")){sensi=95;name="VIVO"}if(ram=="4")sensi+=2;if(ram=="12")sensi-=2;if(sensi>100)sensi=100;document.getElementById('mainSensi').innerText=sensi;document.getElementById('deviceTag').innerText="FOR "+name+" "+ram+"GB";document.getElementById('res').style.display='block';}</script></body></html>
