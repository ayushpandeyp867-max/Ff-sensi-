<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST HOPE - Smart Sensi Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090116;color:#fff;font-family:'Poppins',sans-serif;padding:14px}
.top{text-align:center;margin:18px 0}
.top h1{font-family:'Orbitron';font-size:34px;text-shadow:0 0 20px #a855f7}
.top h1 span{color:#a855f7}
.card{background:#1a1038;border:1px solid #a855f766;border-radius:20px;max-width:420px;margin:0 auto;padding:20px;box-shadow:0 0 25px #a855f733}
.label{font-size:12px;color:#bda8ff;margin:14px 0 6px 4px;display:block;font-weight:700}
select{width:100%;padding:14px;background:#24144f;border:1px solid #ffffff22;border-radius:12px;color:#fff;font-size:15px}
.btn{width:100%;margin-top:20px;padding:16px;background:linear-gradient(90deg,#a855f7,#ff3d8d);border:none;border-radius:14px;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.result{display:none;margin-top:20px;background:#0d0422;border:1.5px dashed #a855f7;border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff15}
.row b{color:#fde047;font-size:18px}
</style>
</head>
<body>
<div class="top"><h1>🔥 LAST <span>HOPE</span> 🔥</h1><p>SMART DEVICE SENSI GENERATOR</p></div>
<div class="card">
<label class="label">📱 SELECT DEVICE</label>
<select id="device"><option>Redmi / POCO - Gaming Beast</option><option>Realme / Narzo - Fast Touch</option><option>Samsung - OneUI</option><option>Infinix / Tecno / Itel</option><option>OnePlus / Nothing - Smooth</option><option>Vivo / iQOO / Oppo</option></select>
<label class="label">💾 RAM</label>
<select id="ram"><option value="4">4GB RAM</option><option value="6" selected>6GB RAM</option><option value="8">8GB RAM</option><option value="12">12GB RAM</option></select>
<button class="btn" onclick="gen()">GENERATE SENSI ⚡</button>
<div id="res" class="result">
<div class="row"><span>General</span><b id="g">100</b></div>
<div class="row"><span>Red Dot</span><b id="r">96</b></div>
<div class="row"><span>2x Scope</span><b id="s2">92</b></div>
<div class="row"><span>4x Scope</span><b id="s4">88</b></div>
<div class="row"><span>AWM</span><b id="awm">79</b></div>
<div class="row"><span>Free Look</span><b id="fl">72</b></div>
<p style="font-size:11px;color:#e9d5ff;margin-top:10px;text-align:center" id="msg"></p>
</div>
</div>
<script>
function gen(){
let d=document.getElementById('device').value;
let ram=document.getElementById('ram').value;
let base=100, deviceName="Your Device";
if(d.includes("Redmi")){base=100; deviceName="Redmi/POCO"}
else if(d.includes("Realme")){base=98; deviceName="Realme"}
else if(d.includes("Samsung")){base=94; deviceName="Samsung"}
else if(d.includes("Infinix")||d.includes("Tecno")){base=100; deviceName="Infinix/Tecno"}
else if(d.includes("OnePlus")||d.includes("Nothing")){base=90; deviceName="OnePlus"}
else if(d.includes("Vivo")||d.includes("iQOO")){base=96; deviceName="Vivo/iQOO"}
if(ram=="4") base-=1;
if(ram=="12") base-=2;
let rnd=(a,b)=>base-Math.floor(Math.random()*(b-a+1)+a);
g.innerText=base; r.innerText=rnd(2,6); s2.innerText=rnd(6,10); s4.innerText=rnd(11,16); awm.innerText=rnd(18,24); fl.innerText=rnd(27,35);
msg.innerText="✅ Optimized for "+deviceName+" with "+ram+"GB RAM";
res.style.display='block';
}
</script>
</body>
</html>
